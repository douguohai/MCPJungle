# Release: tag push 时通过 goreleaser 构建多平台二进制 + Docker 镜像
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────
  # 1. 前端构建（goreleaser 的 before hooks 需要）
  # ─────────────────────────────────────────────
  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build (production)
        run: npm run build

      - name: Copy to embed directory
        run: |
          rm -rf ../../internal/dashboardui/dist
          cp -R dist ../../internal/dashboardui/dist

      - name: Upload embed artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-embed
          path: internal/dashboardui/dist/
          retention-days: 3

  # ─────────────────────────────────────────────
  # 2. Go lint + test
  # ─────────────────────────────────────────────
  verify:
    name: Verify Backend
    runs-on: ubuntu-latest
    needs: frontend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: mcpjungle
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpass"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: "mysql://root:testpass@127.0.0.1:3306/mcpjungle?charset=utf8mb4&parseTime=True&loc=Local"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Go test
        run: go test ./... -count=1 -timeout 120s

  # ─────────────────────────────────────────────
  # 3. GoReleaser：多平台二进制 + Docker 镜像
  # ─────────────────────────────────────────────
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: [frontend, verify]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # goreleaser 的 before hooks 会调用 build-dashboard.sh
      # 但 CI 中 node 可能不在 PATH，所以预先构建好
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download frontend embed
        uses: actions/download-artifact@v4
        with:
          name: dashboard-embed
          path: internal/dashboardui/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
