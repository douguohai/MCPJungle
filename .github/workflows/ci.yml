# CI: PR 和 main push 时验证前端 + 后端
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────
  # 1. 前端：install → typecheck → build
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Copy to embed directory
        run: |
          rm -rf ../../internal/dashboardui/dist
          cp -R dist ../../internal/dashboardui/dist

      - name: Upload embed artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-embed
          path: internal/dashboardui/dist/
          retention-days: 1

  # ─────────────────────────────────────────────
  # 2. 后端：lint → vet → test → build
  # ─────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: frontend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: mcpjungle
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestpass"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DATABASE_URL: "mysql://root:testpass@127.0.0.1:3306/mcpjungle?charset=utf8mb4&parseTime=True&loc=Local"
      MCPHUB_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download frontend embed
        uses: actions/download-artifact@v4
        with:
          name: dashboard-embed
          path: internal/dashboardui/dist

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./... -count=1 -timeout 120s

      - name: Go build
        run: |
          go build -ldflags="-s -w" -o mcpjungle .

      - name: Smoke test
        run: |
          ./mcpjungle start &
          SERVER_PID=$!
          sleep 5
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check failed with HTTP $HTTP_CODE"
            kill $SERVER_PID 2>/dev/null
            exit 1
          fi
          echo "Health check passed (HTTP $HTTP_CODE)"
          kill $SERVER_PID 2>/dev/null

  # ─────────────────────────────────────────────
  # 3. Docker 镜像构建验证
  # ─────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download frontend embed
        uses: actions/download-artifact@v4
        with:
          name: dashboard-embed
          path: internal/dashboardui/dist

      - name: Build Go binary
        run: go build -ldflags="-s -w" -o mcpjungle .

      - name: Build Docker image
        run: docker build -t mcpjungle:ci-test .

      - name: Verify image
        run: docker run --rm mcpjungle:ci-test version
